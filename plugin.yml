name: Build Plugins
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: |
          for d in EndLock CrystalLimit SpawnCage; do
            mvn -B -f $d/pom.xml package
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: '*/target/*.jar'
